name: ros2-car-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
          apt-get install -y python3-colcon-common-extensions qtbase5-dev
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
          test -f build/self_driving_car_demo/libsdc_hud_panel.so
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Upload actual HUD previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-preview
          path: build/self_driving_car_demo/hud-preview/*.png
          if-no-files-found: warn

