# CNB 流水线：ROS2 C++ 工程编译验证
# 镜像 ros:humble 基于 Ubuntu 22.04 + ROS2 Humble

"$":
  push:
    - name: ros2-build
      docker:
        image: ros:humble
      stages:
        - name: build
          script: |
            . /opt/ros/humble/setup.sh
            # 安装 RViz/Qt5 依赖，确保 HUD 面板插件也被编译验证（避免插件被跳过）
            apt-get update && apt-get install -y --no-install-recommends \
              ros-humble-rviz-common \
              ros-humble-pluginlib \
              qtbase5-dev
            colcon build --packages-select self_driving_car_demo
        - name: smoke-test
          script: |
            . /opt/ros/humble/setup.sh
            . install/setup.sh
            # 启动仿真节点，验证节点/话题/可执行文件就绪
            timeout 8 ./install/self_driving_car_demo/lib/self_driving_car_demo/ring_road_sim &
            sleep 3
            ros2 node list | grep -q ring_road_sim
            ros2 topic list | grep -q /simulation/markers
            ros2 topic list | grep -q /simulation/markers_live
            ros2 topic list | grep -q /sensor/lidar
            ros2 topic list | grep -q /sdc/speed
            echo "smoke test passed"
  pull_request:
    - name: ros2-build
      docker:
        image: ros:humble
      stages:
        - name: build
          script: |
            . /opt/ros/humble/setup.sh
            # 安装 RViz/Qt5 依赖，确保 HUD 面板插件也被编译验证（避免插件被跳过）
            apt-get update && apt-get install -y --no-install-recommends \
              ros-humble-rviz-common \
              ros-humble-pluginlib \
              qtbase5-dev
            colcon build --packages-select self_driving_car_demo
            # 校验 HUD 面板插件确实被编译（而非因缺少 rviz_common/Qt5 被跳过）
            test -f build/self_driving_car_demo/libsdc_hud_panel.so && echo "HUD panel plugin built OK"
